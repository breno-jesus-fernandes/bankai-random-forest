name: Build and sign release artifacts

on:
  push:
    branches: [master]
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Build optimized platform wheel
        run: uvx --python 3.11 --from "maturin>=1.9,<2" maturin build --release --interpreter python --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  source-distribution:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build source distribution
        run: uvx --from "maturin>=1.9,<2" maturin sdist --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sign-artifacts:
    name: Sign and verify release artifacts
    needs: [wheels, source-distribution]
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Sign each distribution and verify its workflow identity
        env:
          EXPECTED_WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz)
          if ((${#artifacts[@]} == 0)); then
            echo "No wheel or source archive was produced" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            bundle="${artifact}.sigstore.json"
            uvx --from "sigstore>=3.5,<4" sigstore sign --bundle "$bundle" "$artifact"
            uvx --from "sigstore>=3.5,<4" sigstore verify github "$artifact" \
              --bundle "$bundle" \
              --cert-identity "$EXPECTED_WORKFLOW_IDENTITY" \
              --repository "$GITHUB_REPOSITORY" \
              --trigger "$GITHUB_EVENT_NAME" \
              --sha "$GITHUB_SHA" \
              --name "$GITHUB_WORKFLOW" \
              --ref "$GITHUB_REF"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: signed-release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish tagged release assets
    needs: sign-artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: signed-release-artifacts
          path: dist
      - name: Create GitHub release with wheels and source archive
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
