name: Build and sign release artifacts

on:
  push:
    branches: [master]
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Build optimized platform wheel
        run: uvx --python 3.11 --from "maturin>=1.9,<2" maturin build --release --interpreter python --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  source-distribution:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build source distribution
        run: uvx --from "maturin>=1.9,<2" maturin sdist --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sign-candidates:
    name: Sign release candidates
    needs: [wheels, source-distribution]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create and verify Sigstore signatures
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: dist/*
          upload-signing-artifacts: true
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - uses: actions/upload-artifact@v5
        with:
          name: release-candidates
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish tagged release assets
    needs: [wheels, source-distribution]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release with wheels and source archive
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  sign-published-release:
    name: Sign published release assets
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Sign release files and attach Sigstore bundles
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          release-signing-artifacts: true
