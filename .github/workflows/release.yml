name: Build and attest release artifacts

on:
  push:
    branches: [master]
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Build optimized platform wheel
        run: uvx --python 3.11 --from "maturin>=1.9,<2" maturin build --release --interpreter python --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  source-distribution:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build source distribution
        run: uvx --from "maturin>=1.9,<2" maturin sdist --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  attest-artifacts:
    name: Attest release candidates
    needs: [wheels, source-distribution]
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Generate signed build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: signed-release-candidates
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish tagged release assets
    needs: attest-artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: signed-release-candidates
          path: dist
      - name: Create GitHub release with wheels and source archive
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
