name: Wheel compatibility

on:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "python/**"
      - "crates/**"
      - "tests/**"
      - ".github/workflows/wheel-compatibility.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "python/**"
      - "crates/**"
      - "tests/**"
      - ".github/workflows/wheel-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-wheel:
    name: Python ${{ matrix.python-version }} wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --python "${{ matrix.python-version }}"

      - name: Build optimized wheel
        run: uv run --frozen maturin build --release --compatibility linux --interpreter python --out dist

      - name: Install the built wheel
        run: uv pip install --python .venv/bin/python --reinstall dist/*.whl

      - name: Verify wheel ABI tag
        run: |
          wheel=$(basename dist/*.whl)
          case "$wheel" in
            *-cp311-abi3-*) ;;
            *) echo "Unexpected wheel ABI tag: $wheel" >&2; exit 1 ;;
          esac

      - name: Run full Python suite against installed wheel
        run: uv run --frozen --no-sync python -m pytest -q
