[package]
name = "bankai-random-forest"
version = "0.1.0-alpha.8"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Rust core and PyO3 bindings for bankai-random-forest."
publish = false

[workspace]
members = ["crates/xrf"]

[lib]
name = "bankai_random_forest"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }
xrf = { path = "crates/xrf" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
