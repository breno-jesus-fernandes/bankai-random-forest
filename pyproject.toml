[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bankai-random-forest"
version = "0.1.0a3"
description = "Scikit-learn-compatible random forest backed by a fork of XRF."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
license-files = ["COPYING", "NOTICE"]
authors = [{ name = "Bankai Random Forest contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2.3",
    "scikit-learn>=1.9.1,<1.10",
]

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "bankai_random_forest._core"

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "numba>=0.61.2",
    "pytest>=8.3",
    "scipy>=1.14",
    "shap>=0.51.0",
]
benchmark = [
    "lightgbm>=4.7.0",
    "memory-profiler>=0.61",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
